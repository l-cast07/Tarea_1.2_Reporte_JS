<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Comparacion: Promesas vs Async/Await</h1>
    <button id="promesas">Cargar con Promesas</button>
    <button id="async">Cargar con Async/Await</button>
    <ul id="lista"></ul>

<script>
const lista = document.getElementById("lista");

// --- Opción 1: Usando Promesas (.then / .catch) ---
const cargarUsuariosConPromesas = () => {
    lista.innerHTML = "<li>Cargando con promesas...</li>";

    fetch('https://jsonplaceholder.typicode.com/users')
    .then(respuesta => {
        if (!respuesta.ok) throw new Error("Error en la respuesta");
        return respuesta.json();
    })
    .then(data => {
        mostrarUsuarios(data, "Con Promesas");
    })
    .catch(error => {
        lista.innerHTML = `<li>Error: ${error.message}</li>`;
    });
};

// --- Opción 2: Usando Async/Await ---
const cargarUsuariosConAsync = async () => {
    lista.innerHTML = "<li>Cargando con async/await...</li>";

    try {
        const respuesta = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!respuesta.ok) throw new Error("Error en la respuesta");
        const data = await respuesta.json();
        mostrarUsuarios(data, "Con Async/Await");
    } catch (error) {
        lista.innerHTML = `<li>Error: ${error.message}</li>`;
    }
};

// --- Función para mostrar usuarios en la lista ---
const mostrarUsuarios = (usuarios, metodo) => {
    lista.innerHTML = `<li><strong>${metodo}</strong></li>`;
    usuarios.forEach(usuario => {
        const li = document.createElement("li");
        li.textContent = `${usuario.name} - ${usuario.email}`;
        lista.appendChild(li);
    });
};

// --- Eventos para cada botón ---
document.getElementById("promesas").addEventListener("click", cargarUsuariosConPromesas);
document.getElementById("async").addEventListener("click", cargarUsuariosConAsync);
</script>
</body>
</html>
